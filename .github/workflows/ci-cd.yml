name: backend-ci-cd

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: amdp-registry.skala-ai.com/skala26a-ai2/sk032-backend
  AWS_REGION: ap-northeast-2
  EKS_CLUSTER_NAME: skala-2025
  K8S_NAMESPACE: class-2
  DEPLOYMENT_NAME: sk032-backend
  CONTAINER_NAME: app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend checks
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from app import app
          client = app.test_client()
          resp = client.get("/health")
          assert resp.status_code == 200, resp.status_code
          print("Health check passed")
          PY

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: amdp-registry.skala-ai.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.run_number }}
            ${{ env.IMAGE_NAME }}:gha-latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER_NAME}"

      - name: Ensure Harbor pull secret exists
        run: |
          kubectl create secret docker-registry harbor-registry-secret \
            --namespace "${K8S_NAMESPACE}" \
            --docker-server=amdp-registry.skala-ai.com \
            --docker-username='${{ secrets.HARBOR_USERNAME }}' \
            --docker-password='${{ secrets.HARBOR_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Update deployment image
        run: |
          kubectl set image deployment/"${DEPLOYMENT_NAME}" \
            "${CONTAINER_NAME}"="${IMAGE_NAME}:${{ github.run_number }}" \
            -n "${K8S_NAMESPACE}"

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/"${DEPLOYMENT_NAME}" \
            -n "${K8S_NAMESPACE}" \
            --timeout=180s

      - name: Show pods
        run: kubectl get pods -n "${K8S_NAMESPACE}"
